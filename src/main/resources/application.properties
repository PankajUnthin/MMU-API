spring.datasource.tomcat.initial-size=5
spring.datasource.tomcat.max-active=30
spring.datasource.tomcat.max-idle=15
spring.datasource.tomcat.min-idle=5
spring.datasource.tomcat.min-evictable-idle-time-millis=15000
spring.datasource.tomcat.remove-abandoned=true
spring.datasource.tomcat.remove-abandoned-timeout=300
spring.datasource.tomcat.logAbandoned=true
spring.datasource.continue-on-error=true
spring.datasource.tomcat.max-wait=180000


## below line added by neeraj for reset abandoned DB connection from connection pool 
spring.datasource.tomcat.jdbc-interceptors=ResetAbandonedTimer

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.hibernate.naming_strategy=org.hibernate.cfg.EJB3NamingStrategy

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.fail-on-empty-beans=false

spring.jpa.hibernate.ddl-auto=none

spring.jpa.hibernate.show_sql=true
spring.jpa.hibernate.format_sql=true


spring.session.store-type=redis
spring.redis.password=
spring.redis.port=6379
## Below values are needed for extending the expiry time and extend expiry time. 
iemr.extend.expiry.time=true
iemr.session.expiry.time=1800
enableIPValidation=false

TMReferredWL=90


#logging.pattern.level=DEBUG
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.iemr=DEBUG
logging.level.org.springframework=INFO

spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

spring.datasource.tomcat.testOnBorrow=true
spring.datasource.tomcat.validationQuery=SELECT 1
spring.datasource.tomcat.validationInterval=30000   # 30 sec
logging.level.org.apache.tomcat.jdbc.pool=DEBUG

# Connection timeout - time to establish connection
spring.mvc.async.request-timeout=600000

# ============= SERVER TIMEOUT (Undertow) =============
# Undertow settings (the actual server in use - WildFly/JBoss)
server.undertow.no-request-timeout=600000
server.undertow.max-http-post-size=-1


# =====================================================================
# ===================  NIKSHAY PORTAL INTEGRATION  ====================
# =====================================================================
# NOTHING here is validated at startup. Every property is checked when the
# scheduler fires; a missing or invalid one writes a CONFIG_ERROR row to
# t_nikshay_job_run (error_summary lists every problem) and the run stops.
# Only the master switch is needed to keep the integration dark:
#   nikshay.portal.enabled=false  → SKIPPED row per firing, nothing else.

# ---- Quartz (needed once per application; skip if MMU-API already has it) ----
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.threadPool.threadCount=3

# ---- Master switch ----
nikshay.portal.enabled=false
nikshay.portal.active-environment=UAT

# ---- UAT (beta) ----
nikshay.portal.uat.sso-base-url=https://sso.beta.nikshay.in
nikshay.portal.uat.portal-base-url=https://beta.nikshay.in
nikshay.portal.uat.client-id=29
nikshay.portal.uat.auth-cookie-name=SSOAuthorizationCookieBeta

# ---- PRODUCTION (read only when active-environment=PRODUCTION) ----
nikshay.portal.production.sso-base-url=https://sso.nikshay.in
nikshay.portal.production.portal-base-url=https://www.nikshay.in
nikshay.portal.production.client-id=29
nikshay.portal.production.auth-cookie-name=SSOAuthorizationCookie

# ---- HTTP client ----
nikshay.portal.http.connect-timeout=30s
nikshay.portal.http.request-timeout=60s
nikshay.portal.http.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36

# ---- Pacing between portal calls (0s = none, max 1m) ----
nikshay.portal.throttle.delay-between-requests=1s

# ---- Transient-error retry (network / 5xx). Never applied to AddIndiaTB. ----
nikshay.portal.retry.max-attempts=3
nikshay.portal.retry.initial-backoff=2s
nikshay.portal.retry.max-backoff=30s

# ---- Device login: attempts incl. first; wrong password is never retried ----
nikshay.portal.login.max-attempts=2
nikshay.login.retry-delay=5s
nikshay.login.verify-session=true

# ---- Beneficiaries per device per run ----
nikshay.portal.batch.size-per-device=200

# ---- Transient failures a beneficiary may have before MAX_ATTEMPTS ----
nikshay.portal.generation.max-attempts=3

# ---- Scheduler ----
# Quartz cron: sec min hour day-of-month month day-of-week [year]; one day field must be ?
nikshay.portal.scheduler.zone=Asia/Kolkata
nikshay.portal.scheduler.max-run-duration=20h
nikshay.portal.scheduler.id-generation.enabled=true
nikshay.portal.scheduler.id-generation.cron=0 0 2 * * ?